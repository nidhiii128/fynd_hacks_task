<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Checkout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Mini Checkout</h1>

    <section aria-labelledby="products-heading">
      <h2 id="products-heading">Products</h2>
      <ul class="products" id="product-list" data-testid="product-list"></ul>
    </section>

    <section aria-labelledby="cart-heading">
      <h2 id="cart-heading">Your cart</h2>
      <p id="empty-cart" data-testid="empty-cart">Your cart is empty.</p>
      <table id="cart-table" data-testid="cart-table" hidden>
        <thead>
          <tr>
            <th scope="col">Item</th>
            <th scope="col">Price</th>
            <th scope="col">Quantity</th>
            <th scope="col" class="num">Line total</th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="cart-rows"></tbody>
      </table>
      <p class="total">
        Order total: <strong id="order-total" data-testid="order-total">₹0.00</strong>
      </p>
    </section>

    <section aria-labelledby="details-heading">
      <h2 id="details-heading">Your details</h2>
      <form id="checkout-form" novalidate>
        <div role="alert" id="form-error" data-testid="form-error" class="form-error" hidden></div>
        <div class="field">
          <label for="name">Full name <span aria-hidden="true">*</span></label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="80"
                 aria-required="true" aria-describedby="name-error">
          <p id="name-error" data-testid="name-error" class="field-error" hidden></p>
        </div>
        <button type="submit" id="place-order" data-testid="place-order">Place order</button>
      </form>
    </section>

    <section id="confirmations" data-testid="confirmations" aria-live="polite"></section>
  </main>

  <template id="cart-row-template">
    <tr>
      <th scope="row" class="item-name"></th>
      <td class="unit-price"></td>
      <td>
        <div class="qty">
          <button type="button" class="qty-dec">−</button>
          <input type="text" inputmode="numeric" class="qty-input" size="3">
          <button type="button" class="qty-inc">+</button>
        </div>
        <p class="field-error qty-error" hidden></p>
      </td>
      <td class="num line-total"></td>
      <td><button type="button" class="remove">Remove</button></td>
    </tr>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
